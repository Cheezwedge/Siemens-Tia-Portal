name: CI

# Everything here runs on Linux, without TIA Portal. That covers the generator and
# the house rules - which is most of the standard.
#
# The one thing it cannot do is compile. A green run here means the spec is sound,
# the emitters behave, and the output conforms to rules.yaml; it does not mean the
# SCL is valid. Only TIA says that, which needs a self-hosted Windows runner with a
# licensed install - see docs/10 §4.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  generator:
    name: Tests, validate, build, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r generator/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s generator/tests -v

      # Warnings are printed rather than suppressed. They are written to be read, and
      # the build log is where somebody reviewing a pull request will read them.
      - name: Validate every example spec
        run: |
          # nullglob: a pattern that matches nothing expands to nothing instead of
          # to itself. Without it a wrong path is passed through as a literal
          # '*.yaml', which is exactly how this step was broken for weeks.
          shopt -s nullglob
          specs=(../spec/examples/*.yaml)
          if [ ${#specs[@]} -eq 0 ]; then echo "no example specs found"; exit 1; fi
          status=0
          for spec in "${specs[@]}"; do
            echo "::group::validate $spec"
            python -m tiagen validate "$spec" || status=1
            echo "::endgroup::"
          done
          exit $status
        working-directory: generator

      - name: Build every example spec
        run: |
          shopt -s nullglob
          specs=(../spec/examples/*.yaml)
          if [ ${#specs[@]} -eq 0 ]; then echo "no example specs found"; exit 1; fi
          for spec in "${specs[@]}"; do
            name=$(basename "$spec" .yaml)
            echo "::group::build $name"
            python -m tiagen build "$spec" -o "../out/$name"
            echo "::endgroup::"
          done
        working-directory: generator

      # The generator's own output must satisfy the house rules. If it does not, one
      # of the two is wrong - and this is the step that says so before a human has to.
      - name: Lint the generated output
        run: |
          shopt -s nullglob
          dirs=(../out/*/scl)
          if [ ${#dirs[@]} -eq 0 ]; then echo "nothing was built to lint"; exit 1; fi
          status=0
          for dir in "${dirs[@]}"; do
            echo "::group::lint $dir"
            python -m tiagen lint "$dir" --min-severity warning || status=1
            echo "::endgroup::"
          done
          exit $status
        working-directory: generator

      - name: Rule catalogue
        run: python -m tiagen lint --list
        working-directory: generator

      # tiagen's own reader and writer agreeing proves nothing about the file format.
      # This opens the workbooks with an independent implementation.
      - name: Cross-check workbooks with an independent reader
        run: |
          pip install openpyxl
          python tools/check_workbook_independently.py

      # Kept for review: the artefacts a reviewer would otherwise have to generate
      # themselves to see what a spec change did to the emitted code.
      - name: Upload generated artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-output
          path: out/
          retention-days: 14

  # The installable package, tested on real Windows as a user would run it:
  # extracted from the zip, launched through tiagen.cmd, with no Python on PATH so
  # it can only pass if the bundled interpreter works. No TIA Portal here, so the
  # TIA checks warn rather than fail - TIA itself is tested on the engineering PC,
  # by the same `tiagen selftest`.
  package-windows:
    name: Package and smoke-test on Windows
    runs-on: windows-latest
    needs: generator

    steps:
      - uses: actions/checkout@v4

      # Only to run the packaging script. The package itself must not use it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch the embeddable Python
        shell: pwsh
        run: |
          $url      = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          # Pinned. The package ships this interpreter to corporate PCs, so a
          # different file from the same URL must stop the build, not ride along.
          $expected = "009D6BF7E3B2DDCA3D784FA09F90FE54336D5B60F0E0F305C37F400BF83CFD3B"
          Invoke-WebRequest $url -OutFile py-embed.zip
          $actual = (Get-FileHash py-embed.zip -Algorithm SHA256).Hash
          "embeddable python sha256: $actual"
          if ($actual -ne $expected) {
            Write-Host "::error::embeddable Python hash mismatch: expected $expected"
            exit 1
          }

      - name: Build the package
        run: python packaging/build_package.py --python-embed py-embed.zip --out dist

      - name: Smoke-test the extracted package, with no Python on PATH
        shell: pwsh
        run: |
          $zip  = Get-ChildItem dist\TiaGen-*-win64.zip | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP "pkg"
          Expand-Archive $zip.FullName -DestinationPath $dest
          $home_ = Join-Path $dest "TiaGen"

          # Strip PATH to the bare system folders for the child processes.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Set-Location $home_

          function Step($label, $command) {
            Write-Host "::group::$label"
            cmd /c $command
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) { Write-Host "::error::$label exited $code"; exit $code }
          }

          Step "selftest"  "tiagen.cmd selftest --out `"$env:RUNNER_TEMP\selftest`""
          Step "validate"  "tiagen.cmd validate spec\examples\step-sequence.yaml"
          Step "build"     "tiagen.cmd build spec\examples\step-sequence.yaml -o `"$env:RUNNER_TEMP\out`""
          Step "lint"      "tiagen.cmd lint `"$env:RUNNER_TEMP\out\scl`""
          Step "excel"     "tiagen.cmd excel `"$env:RUNNER_TEMP\new.xlsx`""
          Step "validate workbook" "tiagen.cmd validate templates\example-transfer-station.xlsx"
          Step "build workbook"    "tiagen.cmd build templates\example-transfer-station.xlsx -o `"$env:RUNNER_TEMP\out-xlsx`""
          Step "from-excel"        "tiagen.cmd from-excel templates\example-transfer-station.xlsx -o `"$env:RUNNER_TEMP\from-excel.yaml`""

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: TiaGen-win64
          path: dist/TiaGen-*-win64.zip
          retention-days: 30

      - name: Upload the selftest bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-windows-runner
          path: ${{ runner.temp }}/selftest/*.zip
          retention-days: 14
